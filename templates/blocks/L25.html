     같은 카드 3개 나열 대신 크기/역할을 나눠 배치. 색은 CSS 변수로만. 숫자·영문은 Geist. -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>게시판 목록형 · L25</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/font.css">
<style>
:root{--bg:#ffffff;--surface:#f5f6f8;--ink:#16181d;--mute:#586074;--line:#e6e6e6;--acc:#2f5fe0;--acc-ink:#ffffff}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:Pretendard Variable,Pretendard,system-ui,sans-serif;
     letter-spacing:-.01em;overflow-x:hidden}
a{color:inherit;text-decoration:none}
table{border-collapse:collapse}
input,textarea,select,table{min-width:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
<script>
// ?cs=CS07 로 색 스킴을 갈아끼운다. 기본값은 위 :root.
(async()=>{const id=new URLSearchParams(location.search).get('cs');if(!id)return;
try{const r=await fetch('../data/color_schemes.json');const s=(await r.json()).find(x=>x.id===id);if(!s)return;
const d=document.documentElement.style;d.setProperty('--bg',s.bg);d.setProperty('--surface',s.surface);
d.setProperty('--ink',s.ink);d.setProperty('--mute',s.mute);d.setProperty('--line',s.line);
d.setProperty('--acc',s.accent);d.setProperty('--acc-ink',s.accentInk);}catch(e){}})();
</script>
</head><body>
