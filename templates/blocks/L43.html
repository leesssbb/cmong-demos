<!-- Design read: design-taste-frontend — 모노톤 + 포인트 1색, 장식 그리드선·칩 나열·아이브로우 남발 없음,
     같은 카드 3개 나열 대신 크기/역할을 나눠 배치. 색은 CSS 변수로만. 숫자·영문은 Geist. -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>풀스크린 슬라이드 전환 · L43</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/font.css">
<style>
:root{--bg:#ffffff;--surface:#f5f6f8;--ink:#16181d;--mute:#586074;--line:#e6e6e6;--acc:#2f5fe0;--acc-ink:#ffffff}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:Pretendard Variable,Pretendard,system-ui,sans-serif;
     letter-spacing:-.01em;overflow-x:hidden}
a{color:inherit;text-decoration:none}
table{border-collapse:collapse}
input,textarea,select,table{min-width:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
<script>
// ?cs=CS07 로 색 스킴을 갈아끼운다. 기본값은 위 :root.
(async()=>{const id=new URLSearchParams(location.search).get('cs');if(!id)return;
try{const r=await fetch('../data/color_schemes.json');const s=(await r.json()).find(x=>x.id===id);if(!s)return;
const d=document.documentElement.style;d.setProperty('--bg',s.bg);d.setProperty('--surface',s.surface);
d.setProperty('--ink',s.ink);d.setProperty('--mute',s.mute);d.setProperty('--line',s.line);
d.setProperty('--acc',s.accent);d.setProperty('--acc-ink',s.accentInk);}catch(e){}})();
</script>
</head><body>
<header class="absolute top-0 left-0 right-0 z-40"><div class="mx-auto w-full max-w-6xl px-5 sm:px-8 flex h-16 items-center justify-between text-white"><span class="text-[17px] font-bold">상호</span><button class="rounded-full px-4 py-2 text-[14px] font-semibold" style="border:1px solid rgba(255,255,255,.45)">메뉴</button></div></header><section class="relative min-h-[68vh] sm:min-h-[80vh] flex items-end"><figure data-photo="매장 또는 현장 전경 가로 사진" class="absolute inset-0 rounded-none min-w-0 overflow-hidden rounded-xl" style="background:linear-gradient(140deg,var(--surface),color-mix(in srgb,var(--ink) 12%,var(--surface)))"></figure><div class="absolute inset-0" style="background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,.05))"></div><div class="relative mx-auto w-full max-w-6xl px-5 sm:px-8 pb-14 sm:pb-20 text-white"><h1 class="text-[34px] sm:text-[54px] font-bold leading-[1.12] tracking-[-.03em] max-w-[16ch]">문장 하나로 무엇을 하는 곳인지 밝힙니다</h1><p class="mt-4 max-w-[46ch] text-[15px] text-white/85">둘째 줄에는 위치와 영업시간처럼 바로 확인할 사실을 적습니다.</p><a href="#" class="mt-7 inline-flex rounded-full px-6 py-3 text-[15px] font-semibold" style="background:var(--acc);color:var(--acc-ink)">상담 신청</a></div><div class="absolute bottom-6 left-0 right-0"><div class="mx-auto w-full max-w-6xl px-5 sm:px-8 flex gap-2"><span class="h-[3px] w-10 rounded-full" style="background:var(--acc)"></span><span class="h-[3px] w-10 rounded-full" style="background:rgba(255,255,255,.4)"></span><span class="h-[3px] w-10 rounded-full" style="background:rgba(255,255,255,.4)"></span><span class="h-[3px] w-10 rounded-full" style="background:rgba(255,255,255,.4)"></span></div></div></section><section class="relative flex min-h-[80vh] items-center"><figure data-photo="전면 사진 1" class="absolute inset-0 rounded-none min-w-0 overflow-hidden rounded-xl" style="background:linear-gradient(140deg,var(--surface),color-mix(in srgb,var(--ink) 12%,var(--surface)))"></figure><div class="absolute inset-0" style="background:rgba(0,0,0,.4)"></div><div class="relative mx-auto w-full max-w-6xl px-5 sm:px-8 text-white"><h2 class="text-[28px] sm:text-[44px] font-bold tracking-[-.03em]">섹션 <span style="font-family:Geist,ui-sans-serif">1</span></h2></div></section><section class="relative flex min-h-[80vh] items-center"><figure data-photo="전면 사진 2" class="absolute inset-0 rounded-none min-w-0 overflow-hidden rounded-xl" style="background:linear-gradient(140deg,var(--surface),color-mix(in srgb,var(--ink) 12%,var(--surface)))"></figure><div class="absolute inset-0" style="background:rgba(0,0,0,.4)"></div><div class="relative mx-auto w-full max-w-6xl px-5 sm:px-8 text-white"><h2 class="text-[28px] sm:text-[44px] font-bold tracking-[-.03em]">섹션 <span style="font-family:Geist,ui-sans-serif">2</span></h2></div></section><section class="py-16 sm:py-24" style="background:var(--bg)"><div class="mx-auto w-full max-w-6xl px-5 sm:px-8"><h2 class="text-[26px] sm:text-[34px] font-bold tracking-[-.02em]">사진</h2><div class="mt-7 grid grid-cols-2 md:grid-cols-3 gap-3"><figure data-photo="작업 사진 1" class="min-w-0 aspect-square min-w-0 overflow-hidden rounded-xl" style="background:linear-gradient(140deg,var(--surface),color-mix(in srgb,var(--ink) 12%,var(--surface)))"></figure><figure data-photo="작업 사진 2" class="min-w-0 aspect-square min-w-0 overflow-hidden rounded-xl" style="background:linear-gradient(140deg,var(--surface),color-mix(in srgb,var(--ink) 12%,var(--surface)))"></figure><figure data-photo="작업 사진 3" class="min-w-0 aspect-square min-w-0 overflow-hidden rounded-xl" style="background:linear-gradient(140deg,var(--surface),color-mix(in srgb,var(--ink) 12%,var(--surface)))"></figure><figure data-photo="작업 사진 4" class="min-w-0 aspect-square min-w-0 overflow-hidden rounded-xl" style="background:linear-gradient(140deg,var(--surface),color-mix(in srgb,var(--ink) 12%,var(--surface)))"></figure><figure data-photo="작업 사진 5" class="min-w-0 aspect-square min-w-0 overflow-hidden rounded-xl" style="background:linear-gradient(140deg,var(--surface),color-mix(in srgb,var(--ink) 12%,var(--surface)))"></figure><figure data-photo="작업 사진 6" class="min-w-0 aspect-square min-w-0 overflow-hidden rounded-xl" style="background:linear-gradient(140deg,var(--surface),color-mix(in srgb,var(--ink) 12%,var(--surface)))"></figure></div></div></section><section class="py-14 sm:py-20" style="background:var(--surface)"><div class="mx-auto w-full max-w-6xl px-5 sm:px-8"><h2 class="text-[26px] sm:text-[34px] font-bold tracking-[-.02em]">문의</h2><form class="mt-7 grid gap-3 md:grid-cols-2 max-w-3xl"><label class="min-w-0 text-[13px] font-semibold">이름<input class="mt-1 w-full min-w-0 rounded-lg px-3 py-2.5 text-[15px]" style="background:var(--bg);border:1px solid var(--line)"></label><label class="min-w-0 text-[13px] font-semibold">연락처<input class="mt-1 w-full min-w-0 rounded-lg px-3 py-2.5 text-[15px]" style="background:var(--bg);border:1px solid var(--line)"></label><label class="min-w-0 md:col-span-2 text-[13px] font-semibold">내용<textarea rows="5" class="mt-1 w-full min-w-0 rounded-lg px-3 py-2.5 text-[15px]" style="background:var(--bg);border:1px solid var(--line)"></textarea></label><label class="min-w-0 md:col-span-2 flex items-start gap-2 text-[13px]" style="color:var(--mute)"><input type="checkbox" class="mt-1"><span>개인정보 수집·이용에 동의합니다.</span></label><button class="md:col-span-2 justify-self-start rounded-full px-7 py-3 text-[15px] font-semibold" style="background:var(--acc);color:var(--acc-ink)">보내기</button></form></div></section><footer class="py-10 text-[13px]" style="background:var(--surface);color:var(--mute)"><div class="mx-auto w-full max-w-6xl px-5 sm:px-8"><p>상호 예시 · 대표 홍길동 · 사업자등록번호 000-00-00000 · 서울 어딘가로 00길 12 · 02-000-0000</p><p class="mt-2">포트폴리오용 데모 사이트입니다.</p></div></footer>
</body></html>
